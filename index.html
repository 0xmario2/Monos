<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fcfcfa;font-family:Inter,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.card{border:1px solid #ecebe8;border-radius:16px;background:#fff;margin-top:14px;overflow:hidden}
.small{color:#888;font-size:13px}
/* BERGERAK 100% KEK VIDEO */
.marquee{overflow:hidden;white-space:nowrap}
.marquee-track{display:flex;animation:scroll 18s linear infinite;width:max-content}
.marquee-track.rev{animation-direction:reverse}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
</style>
</head>
<body>

<div class="wrap" style="text-align:center;padding:20px">
<div style="font-weight:800;font-size:20px">● monos</div>
</div>

<!-- MULTI-CHAIN BERGERAK PERSIS GAMBAR LU -->
<div class="wrap"><div class="card">
<div style="padding:0">
<div class="marquee"><div class="marquee-track">
<img src="multi.png" style="height:210px"><img src="multi.png" style="height:210px;margin-left:0">
</div></div>
</div>
<div style="padding:16px 18px 18px"><div style="font-weight:700;font-size:18px">Multi-chain</div><div class="small">Built to support all your favourite blockchains</div></div>
</div></div>

<!-- PROVEN TECH NFT BERGERAK PERSIS GAMBAR LU -->
<div class="wrap"><div class="card">
<div style="padding:0">
<div class="marquee"><div class="marquee-track">
<img src="nft.png" style="height:190px"><img src="nft.png" style="height:190px;margin-left:0">
</div></div>
<div class="marquee" style="margin-top:6px"><div class="marquee-track rev" style="animation-duration:22s">
<img src="nft.png" style="height:190px;transform:scaleY(-1)"><img src="nft.png" style="height:190px;transform:scaleY(-1);margin-left:0">
</div></div>
<div class="marquee" style="margin-top:6px"><div class="marquee-track" style="animation-duration:26s">
<img src="nft.png" style="height:190px"><img src="nft.png" style="height:190px;margin-left:0">
</div></div>
</div>
<div style="padding:16px 18px 18px"><div style="font-weight:700;font-size:18px">Proven Tech</div><div class="small">More than 80,000 tokens minted so far</div></div>
</div></div>

</body>
</html>
